pid /tmp/nginx.pid;
error_log stderr;

events {}

http {
    include /etc/nginx/mime.types;
    access_log /dev/stdout;
    client_body_temp_path /data/thumbnails/.nginx-tmp;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;

    server {
        listen 8080;
        root /data;
        client_max_body_size 5m;

        location ~ "^/thumbnails/(?:books/(?:uploads/)?)?[A-Za-z0-9_-]+\.(?:jpg|jpeg|png|webp|gif|avif)$" {
            types {
                image/jpeg jpg jpeg;
                image/png png;
                image/webp webp;
                image/gif gif;
                image/avif avif;
            }
            add_header X-Content-Type-Options nosniff always;

            dav_methods PUT DELETE;
            dav_access user:rw;
            min_delete_depth 2;
            create_full_put_path on;

            limit_except GET {
                auth_basic "Read It thumbnails";
                auth_basic_user_file /etc/nginx/thumbnail.htpasswd;
            }
        }

        location / {
            return 404;
        }
    }
}
